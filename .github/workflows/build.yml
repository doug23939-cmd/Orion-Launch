name: Build Orion Launcher
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          mkdir proj
          unzip -q OrionLauncher*.zip -d proj
          echo "DIR=$(dirname "$(find proj -name settings.gradle.kts | head -1)")" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - name: Build
        run: cd "$DIR" && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: OrionLauncher-apk, path: "${{ env.DIR }}/app/build/outputs/apk/debug/*.apk" }
